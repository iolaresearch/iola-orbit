<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>IOLA Orbit</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }

        canvas {
            display: block;
        }
    </style>
    <script type="importmap">
    {
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
    }
    </script>
</head>
<body>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

// Scene
const scene = new THREE.Scene();

// Camera
const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.z = 20;

// Renderer
const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.autorotate = true;
controls.autoRotateSpeed = 0.5;

// Earth
const earthGeometry = new THREE.SphereGeometry(6.371, 64, 64);
const earthMaterial = new THREE.MeshBasicMaterial({
    color: 0x2233ff,
    wireframe: true
});

const earth = new THREE.Mesh(
    earthGeometry,
    earthMaterial
);

scene.add(earth);

//Fetch Satellites
const response = await fetch("http://127.0.0.1:8000/satellites");
const satellites = await response.json();

// get set of satellites
for (const satellite of satellites.slice(0, 100)) {
    const satelliteGeometry = new THREE.SphereGeometry(0.03, 6, 6);
    const satelliteMaterial = new THREE.MeshBasicMaterial({
        color: 0xff0000
    });

    const satelliteMesh = new THREE.Mesh(
        satelliteGeometry,
        satelliteMaterial
    );

    // scale down cooridnates
    satelliteMesh.position.set(
    satellite.x / 1000,
    satellite.y / 1000,
    satellite.z / 1000
    );
    scene.add(satelliteMesh);
};

// annimate loop
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

animate(earth.rotation.y += 0.002);


</script>

</body>
</html>
