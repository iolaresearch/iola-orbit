<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="./styles.css">
    <title>IOLA Orbit — Command Center</title>
    <script type="importmap">
    {
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
    }
    </script>
    <style>
    /* IkirereMesh command center additions */
    #mesh-panel {
        position: absolute;
        bottom: 24px;
        right: 24px;
        z-index: 100;
        width: 280px;
        background: rgba(0,0,0,0.72);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 6px;
        padding: 16px;
        backdrop-filter: blur(16px);
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    #mesh-panel .section-title {
        font-size: 9px;
        letter-spacing: 0.22em;
        color: rgba(255,255,255,0.3);
        margin-bottom: 2px;
    }
    .spawn-row {
        display: flex;
        gap: 8px;
        align-items: center;
    }
    .spawn-row label { font-size: 10px; color: rgba(255,255,255,0.4); white-space: nowrap; }
    .spawn-row input[type=number] {
        width: 48px; padding: 4px 6px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 3px; color: #fff;
        font-family: inherit; font-size: 11px; text-align: center;
    }
    #spawn-btn {
        flex: 1; padding: 7px 0;
        background: rgba(0,255,136,0.08);
        border: 1px solid rgba(0,255,136,0.35);
        border-radius: 3px; color: #00ff88;
        font-family: inherit; font-size: 9px;
        letter-spacing: 0.1em; cursor: pointer;
        transition: all 0.15s;
    }
    #spawn-btn:hover { background: rgba(0,255,136,0.18); }
    #spawn-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Time mode toggle */
    .time-modes {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 4px;
    }
    .time-btn {
        padding: 6px 2px;
        background: transparent;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 3px; color: rgba(255,255,255,0.35);
        font-family: inherit; font-size: 8px;
        letter-spacing: 0.05em; cursor: pointer;
        text-align: center; transition: all 0.15s;
        line-height: 1.3;
    }
    .time-btn.active {
        border-color: rgba(0,187,255,0.6);
        color: #00bbff;
        background: rgba(0,187,255,0.07);
    }
    .time-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Agent cards */
    #agent-cards { display: flex; flex-direction: column; gap: 6px; }
    .agent-card {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 4px; padding: 10px;
        border-left: 3px solid #ff3a6e;
        font-size: 10px;
    }
    .agent-card-header {
        display: flex; justify-content: space-between;
        align-items: center; margin-bottom: 6px;
    }
    .agent-name { font-size: 11px; font-weight: 600; color: #fff; }
    .agent-mode {
        font-size: 8px; letter-spacing: 0.1em;
        padding: 2px 6px; border-radius: 2px;
        background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.6);
    }
    .agent-mode.IDLE       { color: rgba(255,255,255,0.4); }
    .agent-mode.IMAGING    { background: rgba(0,255,136,0.12); color: #00ff88; }
    .agent-mode.DOWNLINK   { background: rgba(0,187,255,0.12); color: #00bbff; }
    .agent-mode.YIELD_COVERAGE { background: rgba(255,165,0,0.12); color: orange; }
    .agent-mode.SAFE_MODE  { background: rgba(255,100,100,0.12); color: #ff6464; }
    .agent-bars { display: flex; flex-direction: column; gap: 3px; }
    .bar-row { display: flex; align-items: center; gap: 6px; }
    .bar-label { font-size: 8px; color: rgba(255,255,255,0.3); width: 50px; }
    .bar-track {
        flex: 1; height: 4px;
        background: rgba(255,255,255,0.06);
        border-radius: 2px; overflow: hidden;
    }
    .bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }
    .bar-fill.battery { background: #00ff88; }
    .bar-fill.storage  { background: #00bbff; }
    .bar-fill.reward   { background: #ff3a6e; }
    .bar-val { font-size: 8px; color: rgba(255,255,255,0.5); width: 30px; text-align: right; }

    .step-counter {
        font-size: 9px; color: rgba(255,255,255,0.3);
        text-align: center; letter-spacing: 0.1em;
    }
    .step-counter span { color: rgba(255,255,255,0.7); }

    /* Extended inspector for IOLA agents */
    .inspector-reward { margin-top: 8px; }
    .reward-row { display: flex; justify-content: space-between; font-size: 10px; margin-bottom: 3px; }
    .reward-row .rl { color: rgba(255,255,255,0.3); }
    .reward-row .rv { color: #fff; font-weight: 500; }

    /* Ground station markers */
    .gs-badge {
        display: inline-block; font-size: 8px;
        padding: 1px 5px; border-radius: 2px;
        background: rgba(255,165,0,0.15);
        border: 1px solid rgba(255,165,0,0.3);
        color: orange; margin-right: 4px;
    }

    /* Locate button in agent card */
    .locate-btn {
        margin-top: 6px; width: 100%;
        padding: 3px 0; font-size: 9px; letter-spacing: 0.08em;
        background: rgba(0,255,170,0.08); color: #00ffaa;
        border: 1px solid rgba(0,255,170,0.25); border-radius: 2px;
        cursor: pointer; font-family: inherit;
    }
    .locate-btn:hover { background: rgba(0,255,170,0.18); }
    </style>
</head>
<body>

<img id="watermark" src="./iola-logo-space.png" alt="IOLA">

<!-- Left panel: catalog stats -->
<div id="ui">
    <div class="wordmark">IOLA ORBIT</div>
    <div class="panel">
        <div class="stat-row">
            <span class="label">TOTAL</span>
            <span id="satellite-count">—</span>
        </div>
        <div class="stat-row">
            <span class="label leo">LEO</span>
            <span id="leo-count" class="leo">—</span>
        </div>
        <div class="stat-row">
            <span class="label meo">MEO</span>
            <span id="meo-count" class="meo">—</span>
        </div>
        <div class="stat-row">
            <span class="label geo">GEO</span>
            <span id="geo-count" class="geo">—</span>
        </div>
        <div class="divider"></div>
        <div class="filters">
            <button class="filter-btn leo active" data-class="0">LEO</button>
            <button class="filter-btn meo active" data-class="1">MEO</button>
            <button class="filter-btn geo active" data-class="2">GEO</button>
        </div>
        <div class="divider"></div>
        <button id="pause-btn">PAUSE</button>
    </div>
</div>

<!-- Right panel: inspector (background satellite or IOLA agent) -->
<div id="inspector" class="hidden">
    <div class="inspector-header">OBJECT</div>
    <div id="inspector-name"></div>
    <div class="divider"></div>
    <div class="inspector-grid">
        <span class="label">NORAD</span><span id="inspector-norad"></span>
        <span class="label">CLASS</span><span id="inspector-class"></span>
        <span class="label">ALT</span><span id="inspector-alt"></span>
    </div>
    <!-- Extended fields for IOLA agents -->
    <div id="inspector-agent-section" style="display:none;">
        <div class="divider"></div>
        <div class="inspector-grid">
            <span class="label">MODE</span><span id="inspector-mode"></span>
            <span class="label">BATTERY</span><span id="inspector-battery"></span>
            <span class="label">STORAGE</span><span id="inspector-storage"></span>
            <span class="label">SUNLIT</span><span id="inspector-sunlit"></span>
            <span class="label">WINDOW</span><span id="inspector-window"></span>
        </div>
        <div class="inspector-reward">
            <div class="divider"></div>
            <div class="inspector-header">REWARD BREAKDOWN</div>
            <div class="reward-row"><span class="rl">SURVIVAL</span><span class="rv" id="rw-survival"></span></div>
            <div class="reward-row"><span class="rl">MISSION</span><span class="rv" id="rw-mission"></span></div>
            <div class="reward-row"><span class="rl">OPTIONALITY</span><span class="rv" id="rw-opt"></span></div>
            <div class="reward-row"><span class="rl">EXTERNALITY</span><span class="rv" id="rw-ext"></span></div>
        </div>
    </div>
</div>

<!-- Bottom-right: IkirereMesh command center -->
<div id="mesh-panel">
    <div class="section-title">IKIRERE MESH — COMMAND CENTER</div>

    <!-- Spawn controls -->
    <div class="spawn-row">
        <label>AGENTS</label>
        <input type="number" id="fleet-size" value="3" min="1" max="10">
        <button id="spawn-btn">SPAWN FLEET</button>
    </div>

    <!-- Time mode -->
    <div class="section-title" style="margin-top:4px;">OBSERVATION MODE</div>
    <div class="time-modes">
        <button class="time-btn active" data-mode="realtime">
            LIVE<br><span style="font-size:7px;opacity:0.6">real time</span>
        </button>
        <button class="time-btn" data-mode="compressed">
            PASS<br><span style="font-size:7px;opacity:0.6">90 min → 90 sec</span>
        </button>
        <button class="time-btn" data-mode="step">
            STEP<br><span style="font-size:7px;opacity:0.6">manual</span>
        </button>
    </div>
    <button id="step-btn" style="display:none; width:100%; padding:6px 0;
        background:rgba(0,187,255,0.08); border:1px solid rgba(0,187,255,0.3);
        border-radius:3px; color:#00bbff; font-family:inherit; font-size:9px;
        letter-spacing:0.1em; cursor:pointer;">
        NEXT STEP →
    </button>

    <!-- Step counter -->
    <div class="step-counter" id="step-display" style="display:none;">
        STEP <span id="step-num">0</span> / 90 &nbsp;·&nbsp; EP <span id="ep-id">—</span>
    </div>

    <!-- Agent cards -->
    <div id="agent-cards"></div>
</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

// ─── Configuration ───────────────────────────────────────────────────────────
const API_BASE = window.location.hostname === "localhost"
    ? "http://localhost:8000"
    : "https://iola-orbit-server.onrender.com";
const WS_BASE  = API_BASE.replace("https://", "wss://").replace("http://", "ws://");

const CLASS_COLORS = [0x00ff88, 0x00bbff, 0xff6600];
const CLASS_NAMES  = ["LEO", "MEO", "GEO"];
const COUNT_IDS    = ["leo-count", "meo-count", "geo-count"];
const AGENT_COLOR  = 0xff3a6e;   // Hot pink — unmistakable against LEO green

// ─── Scene setup ─────────────────────────────────────────────────────────────
const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 20;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.autoRotateSpeed = 0.5;

// Earth
const textureLoader = new THREE.TextureLoader();
const earth = new THREE.Mesh(
    new THREE.SphereGeometry(6.371, 64, 64),
    new THREE.MeshPhongMaterial({
        map: textureLoader.load("https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"),
        specular: new THREE.Color(0x222222), shininess: 12
    })
);
scene.add(earth);

const atmosphere = new THREE.Mesh(
    new THREE.SphereGeometry(6.5, 64, 64),
    new THREE.MeshBasicMaterial({ color: 0x3399ff, transparent: true, opacity: 0.08, side: THREE.BackSide })
);
scene.add(atmosphere);

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(150, 60, 90);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.08));
const sun = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), new THREE.MeshBasicMaterial({ color: 0xFFFDE7 }));
sun.position.set(150, 60, 90);
scene.add(sun);

const starPos = [];
for (let i = 0; i < 1000; i++) starPos.push((Math.random()-0.5)*2000, (Math.random()-0.5)*2000, (Math.random()-0.5)*2000);
const starsGeo = new THREE.BufferGeometry();
starsGeo.setAttribute("position", new THREE.Float32BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.15 })));

// Background satellite point clouds (per orbit class)
const classGeos = CLASS_COLORS.map(() => new THREE.BufferGeometry());
const classPts  = classGeos.map((geo, i) => {
    const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color: CLASS_COLORS[i], size: 0.05 }));
    scene.add(pts);
    return pts;
});

// IOLA agent spheres — large, bright white core, visible at any zoom
const agentMeshes = [];
const AGENT_SPHERE = new THREE.SphereGeometry(0.18, 16, 16);

// Ground station markers — parented to Earth so they rotate with it
// Three.js Earth: lon=0 is at (0,0,-R) with no rotation; positive lon goes west in default orientation.
// We use the same spherical convention as the satellite worker: x=R·cos(lat)·cos(lon), etc.
function addGroundStation(lat, lon) {
    const phi = lat  * Math.PI / 180;   // geographic latitude → elevation angle
    const lam = lon  * Math.PI / 180;   // geographic longitude
    const R   = 6.371;
    // ECI-aligned: x = R·cos(lat)·cos(lon), y = R·sin(lat), z = -R·cos(lat)·sin(lon)
    // The minus on z matches Three.js default Earth texture orientation
    const x =  R * Math.cos(phi) * Math.cos(lam);
    const y =  R * Math.sin(phi);
    const z = -R * Math.cos(phi) * Math.sin(lam);
    const dot = new THREE.Mesh(
        new THREE.SphereGeometry(0.07, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0xffaa00 })
    );
    dot.position.set(x, y, z);
    earth.add(dot);   // child of Earth — rotates with it
}
addGroundStation(5.6037,  -0.1870);   // Accra, Ghana
addGroundStation(-1.9415,  30.0574);  // Kigali, Rwanda

// ─── Catalog loading ──────────────────────────────────────────────────────────
let satMeta = [];
let totalCount = 0;
let paused = false;
let workerReady = false;
let pendingPropagate = false;

const worker = new Worker("./propagate.worker.js");

worker.onmessage = (e) => {
    if (e.data.type === "ready") {
        workerReady = true;
        totalCount  = e.data.count;
        document.getElementById("satellite-count").innerText = totalCount;
        if (!paused) worker.postMessage({ type: "propagate" });
        return;
    }
    if (e.data.type === "positions") {
        const { positions, altitudes, classes } = e.data;
        pendingPropagate = false;
        const classBufs  = [[], [], []];
        const classMetas = [[], [], []];
        const classCounts = [0, 0, 0];
        for (let i = 0; i < totalCount; i++) {
            const cls = classes[i];
            classBufs[cls].push(positions[i*3], positions[i*3+1], positions[i*3+2]);
            classMetas[cls].push({ name: satMeta[i]?.name, norad_id: satMeta[i]?.norad_id, altitude: altitudes[i], classIdx: cls });
            classCounts[cls]++;
        }
        for (let c = 0; c < 3; c++) {
            classGeos[c].setAttribute("position", new THREE.BufferAttribute(new Float32Array(classBufs[c]), 3));
            classGeos[c].attributes.position.needsUpdate = true;
            COUNT_IDS.forEach((id, idx) => { if (idx === c) document.getElementById(id).innerText = classCounts[c]; });
        }
        classPts.forEach((_, c) => { classPts[c].userData.metas = classMetas[c]; });
    }
};

const response = await fetch(`${API_BASE}/tles`);
const raw = await response.text();
const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);
for (let i = 0; i < lines.length - 2; i += 3) {
    if (lines[i].startsWith("1 ") || lines[i].startsWith("2 ")) continue;
    satMeta.push({ name: lines[i], norad_id: lines[i+1].substring(2,7).trim() });
}
worker.postMessage({ type: "init", raw });

// ─── Simulation clock ─────────────────────────────────────────────────────────
// Each time mode advances simulated time at a different rate:
//   realtime:   1 real second   = 1 simulated second   (1× speed)
//   compressed: 1 real second   = 60 simulated seconds (60× speed — 90min pass in 90s)
//   step:       manual advance  = 60 simulated seconds per click
const TIME_MULTIPLIERS = { realtime: 1, compressed: 60, step: 0 };
let simTimeMs  = Date.now();   // simulated UTC in ms — starts at real now
let lastRealMs = Date.now();

// Propagate interval — fires every 250ms real time; advances simulated clock by multiplier
const propagateLoop = setInterval(() => {
    if (!workerReady || paused) return;
    const nowReal = Date.now();
    const elapsed = nowReal - lastRealMs;
    lastRealMs = nowReal;

    const mult = TIME_MULTIPLIERS[timeMode] ?? 1;
    if (timeMode === "realtime") {
        // Always use actual current time — zero drift, positions are always real
        simTimeMs = Date.now();
    } else {
        simTimeMs += elapsed * mult;
    }

    if (!pendingPropagate) {
        pendingPropagate = true;
        worker.postMessage({ type: "propagate", timestamp: simTimeMs });
    }
}, 250);

// ─── IkirereMesh state ────────────────────────────────────────────────────────
let meshActive   = false;
let meshAgents   = [];      // latest agent state from API
let meshWS       = null;
let timeMode     = "realtime";   // Default: LIVE real time
let wsManualStep = null;   // resolve function for step-mode promise

// sim_epoch_utc: the simulation's current UTC time (ISO string) from the server.
// Used to drive Earth rotation so ECI positions map to correct geography.
let simEpochMs   = null;   // ms since unix epoch of last received sim_epoch_utc
let simEpochRealMs = null; // wall-clock ms when that epoch was received
// Per-agent velocity for client-side extrapolation between server steps
let agentVelocities = {};  // norad_id → {vx, vy, vz} in km/s

// Convert ECI km → Three.js scene units (Earth radius = 6.371 scene units)
function eciToScene(x, y, z) {
    const scale = 1 / 1000;  // 1000 km = 1 scene unit
    return new THREE.Vector3(x * scale, y * scale, z * scale);
}

// GMST from a Unix timestamp in ms.
// θ = 280.46061837 + 360.98564736629 × (JD - 2451545.0)  [degrees]
// JD = unixMs / 86400000 + 2440587.5
function gmstFromMs(unixMs) {
    const jd      = unixMs / 86400000 + 2440587.5;
    const deg     = 280.46061837 + 360.98564736629 * (jd - 2451545.0);
    return (deg % 360) * Math.PI / 180;
}

const MODE_COLORS = {
    IMAGING:        0x00ff88,
    DOWNLINK:       0x00bbff,
    YIELD_COVERAGE: 0xffaa00,
    SAFE_MODE:      0xff4444,
    IDLE:           0xff3a6e,
    MANEUVER_PREP:  0xffff00,
    REQUEST_RELAY:  0xcc88ff,
    HOLD_POSITION:  0xffffff,
};

function updateAgentMeshes(agents) {
    // Grow pool
    while (agentMeshes.length < agents.length) {
        const mat  = new THREE.MeshPhongMaterial({ emissive: 0xff3a6e, emissiveIntensity: 1.5, color: 0xffffff });
        const mesh = new THREE.Mesh(AGENT_SPHERE, mat);
        scene.add(mesh);
        agentMeshes.push(mesh);
    }
    for (let i = agents.length; i < agentMeshes.length; i++) agentMeshes[i].visible = false;

    agents.forEach((agent, i) => {
        const pos = eciToScene(agent.x, agent.y, agent.z);
        agentMeshes[i].position.copy(pos);
        agentMeshes[i].visible = true;
        agentMeshes[i].userData = agent;
        const hex = MODE_COLORS[agent.mode] || 0xff3a6e;
        agentMeshes[i].material.emissive.setHex(hex);
        agentMeshes[i].material.color.setHex(hex);
    });
}

function makeBar(label, pct, cls) {
    const row   = document.createElement("div"); row.className = "bar-row";
    const lbl   = document.createElement("div"); lbl.className = "bar-label"; lbl.textContent = label;
    const track = document.createElement("div"); track.className = "bar-track";
    const fill  = document.createElement("div"); fill.className = `bar-fill ${cls}`; fill.style.width = `${pct}%`;
    const val   = document.createElement("div"); val.className = "bar-val"; val.textContent = `${Math.round(pct)}%`;
    track.appendChild(fill); row.append(lbl, track, val);
    return row;
}

function renderAgentCards(agents) {
    const container = document.getElementById("agent-cards");
    // Clear safely — no user data involved
    while (container.firstChild) container.removeChild(container.firstChild);

    agents.forEach(agent => {
        const battPct  = Math.max(0, Math.min(100, agent.battery_pct));
        const storePct = Math.max(0, Math.min(100, agent.storage_pct));

        const card = document.createElement("div");
        card.className = "agent-card";

        // Header: name + mode badge — all textContent, no innerHTML
        const header = document.createElement("div"); header.className = "agent-card-header";
        const nameEl = document.createElement("div"); nameEl.className = "agent-name";
        const rawName = agent.name || "";
        nameEl.textContent = rawName.length > 18 ? rawName.substring(0, 18) + "…" : rawName;

        const modeEl = document.createElement("div");
        const safeMode = (agent.mode || "IDLE").replace(/[^A-Z_]/g, "");  // whitelist A-Z and _
        modeEl.className = `agent-mode ${safeMode}`;
        modeEl.textContent = safeMode.replace("_", " ");

        header.append(nameEl, modeEl);

        // Bars
        const bars = document.createElement("div"); bars.className = "agent-bars";
        bars.append(makeBar("BATTERY", battPct, "battery"), makeBar("STORAGE", storePct, "storage"));

        // Status line
        const status = document.createElement("div");
        status.style.cssText = "font-size:8px;color:rgba(255,255,255,0.3);margin-top:5px;";
        status.textContent = `${Math.round(agent.altitude_km)} km · ${agent.sunlit ? "SUNLIT" : "ECLIPSE"}`;

        if (agent.in_contact_window) {
            const badge = document.createElement("span"); badge.className = "gs-badge";
            badge.textContent = "IN WINDOW";
            status.append(" ", badge);
        }

        // LOCATE button — pans camera to this agent and shows its arc
        const locateBtn = document.createElement("button");
        locateBtn.className = "locate-btn";
        locateBtn.textContent = "LOCATE";
        locateBtn.addEventListener("click", () => {
            const idx = meshAgents.findIndex(a => a.norad_id === agent.norad_id);
            showArc(idx);
            if (idx >= 0 && agentMeshes[idx]) {
                // Move OrbitControls target to the agent's current position
                controls.target.copy(agentMeshes[idx].position);
                controls.update();
            }
        });

        card.append(header, bars, status, locateBtn);
        container.appendChild(card);
    });
}

function updateStepDisplay(step, episodeId) {
    const d = document.getElementById("step-display");
    d.style.display = "block";
    document.getElementById("step-num").innerText = step;
    document.getElementById("ep-id").innerText = episodeId ? episodeId.substring(0,12) : "—";
}

function applyMeshState(data) {
    meshAgents = data.agents || [];

    // Record simulation epoch for Earth rotation sync
    if (data.sim_epoch_utc) {
        simEpochMs     = new Date(data.sim_epoch_utc).getTime();
        simEpochRealMs = Date.now();
    }

    // Store velocities for per-frame Keplerian extrapolation
    meshAgents.forEach(a => {
        if (a.vx !== undefined) agentVelocities[a.norad_id] = { vx: a.vx, vy: a.vy, vz: a.vz };
    });

    updateAgentMeshes(meshAgents);
    renderAgentCards(meshAgents);
    if (data.episode_step !== undefined) updateStepDisplay(data.episode_step, data.episode_id);
}

// ─── Spawn ────────────────────────────────────────────────────────────────────
document.getElementById("spawn-btn").addEventListener("click", async () => {
    const btn = document.getElementById("spawn-btn");
    btn.disabled = true;
    btn.innerText = "SPAWNING…";

    const fleetSize = parseInt(document.getElementById("fleet-size").value) || 3;
    if (meshWS) { meshWS.close(); meshWS = null; }

    try {
        // Step 1: single health check — if it responds, proceed; if not, still try spawn.
        // The server may be alive (serving /tles) even if /health cold-starts slowly.
        // We never block spawn on health; it is informational only.
        btn.innerText = "CONNECTING…";
        try {
            await fetch(`${API_BASE}/health`, { signal: AbortSignal.timeout(5000) });
        } catch(_) {}   // proceed regardless — spawn will surface the real error

        // Step 2: kick off spawn (returns immediately with state=running or state=ready)
        btn.innerText = "SPAWNING…";
        const spawnRes = await fetch(
            `${API_BASE}/mesh/spawn?fleet_size=${fleetSize}&seed=42`,
            { method: "POST", signal: AbortSignal.timeout(15000) }
        );
        const spawnData = await spawnRes.json();
        if (spawnData.state === "error") { btn.disabled = false; btn.innerText = "SPAWN FLEET"; alert(spawnData.error); return; }

        // Step 3: poll /mesh/spawn/status until ready
        let ready = false;
        for (let poll = 0; poll < 60; poll++) {
            await new Promise(r => setTimeout(r, 3000));
            btn.innerText = `SPAWNING… ${(poll+1)*3}s`;
            try {
                const s = await fetch(`${API_BASE}/mesh/spawn/status`, { signal: AbortSignal.timeout(5000) });
                const sd = await s.json();
                if (sd.state === "ready") { ready = true; applyMeshState(sd); break; }
                if (sd.state === "error") { alert(`Spawn error: ${sd.error}`); break; }
            } catch(_) {}
        }

        if (!ready) { btn.disabled = false; btn.innerText = "SPAWN FLEET"; alert("Spawn timed out. Try again."); return; }

        meshActive = true;
        btn.innerText = "RESTART";
        btn.disabled  = false;
        startStream();
    } catch(e) {
        btn.disabled  = false;
        btn.innerText = "SPAWN FLEET";
        console.error("Spawn failed:", e);
        alert(`Spawn failed: ${e.message}. Check browser console for details.`);
    }
});

// ─── Time mode selection — controls ALL satellite simulation speed ────────────
document.querySelectorAll(".time-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".time-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        timeMode = btn.dataset.mode;
        lastRealMs = Date.now();
        // LIVE: snap simulation clock back to actual real time immediately
        if (timeMode === "realtime") simTimeMs = Date.now();

        const stepBtn = document.getElementById("step-btn");
        stepBtn.style.display = timeMode === "step" ? "block" : "none";

        // Reconnect agent stream if active
        if (meshActive) {
            if (meshWS) { meshWS.close(); meshWS = null; }
            startStream();
        }
    });
});

// Manual step — advances simulation clock by one 60-second step for all satellites + agents
document.getElementById("step-btn").addEventListener("click", () => {
    simTimeMs += 60 * 1000;   // advance one decision step for all satellites
    if (!pendingPropagate && workerReady) {
        pendingPropagate = true;
        worker.postMessage({ type: "propagate", timestamp: simTimeMs });
    }
    if (meshWS && timeMode === "step") {
        meshWS.send(JSON.stringify({ action: "step" }));
    }
});

// ─── WebSocket stream ─────────────────────────────────────────────────────────
function startStream() {
    const ws = new WebSocket(`${WS_BASE}/mesh/stream?mode=${timeMode}`);
    meshWS = ws;

    ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.error) { console.error("Mesh stream error:", data.error); return; }
        if (data.type === "episode_end") {
            console.log("Episode complete at step", data.step);
            return;
        }
        applyMeshState(data);
    };

    ws.onerror  = (e) => console.error("WS error", e);
    ws.onclose  = ()  => { if (meshWS === ws) meshWS = null; };
}

// ─── Filters & UI ─────────────────────────────────────────────────────────────
document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        btn.classList.toggle("active");
        classPts[parseInt(btn.dataset.class)].visible = btn.classList.contains("active");
    });
});

document.getElementById("pause-btn").addEventListener("click", () => {
    paused = !paused;
    document.getElementById("pause-btn").innerText = paused ? "RESUME" : "PAUSE";
});

// ─── Orbital arc visualization ────────────────────────────────────────────────
// One arc line per agent, shown when that agent is clicked.
const arcLines = [];   // THREE.Line objects, one per possible agent
const ARC_MATERIAL = new THREE.LineBasicMaterial({
    color: 0x00ffaa, transparent: true, opacity: 0.35, depthWrite: false
});

function buildArc(agent) {
    // Trace 90 × 60s Keplerian steps from agent's current position using
    // linear extrapolation. Good enough for display at orbital scale.
    // Phase 4: replace with proper Keplerian propagator call.
    const scale = 1 / 1000;
    const pts   = [];
    let x = agent.x, y = agent.y, z = agent.z;
    const vel = agentVelocities[agent.norad_id] || { vx: 0, vy: 0, vz: 0 };
    const dt  = 60; // seconds per step
    for (let s = 0; s <= 90; s++) {
        pts.push(new THREE.Vector3(
            (x + vel.vx * s * dt) * scale,
            (y + vel.vy * s * dt) * scale,
            (z + vel.vz * s * dt) * scale,
        ));
    }
    return new THREE.BufferGeometry().setFromPoints(pts);
}

let activeArcIndex = -1;  // which agent arc is currently shown

function showArc(agentIndex) {
    // Hide all arcs first
    arcLines.forEach(l => { l.visible = false; });

    if (agentIndex < 0 || agentIndex >= meshAgents.length) { activeArcIndex = -1; return; }
    const agent = meshAgents[agentIndex];

    // Grow pool if needed
    while (arcLines.length <= agentIndex) {
        const line = new THREE.Line(new THREE.BufferGeometry(), ARC_MATERIAL.clone());
        scene.add(line);
        arcLines.push(line);
    }

    arcLines[agentIndex].geometry.dispose();
    arcLines[agentIndex].geometry = buildArc(agent);
    arcLines[agentIndex].visible  = true;
    activeArcIndex = agentIndex;
}

// ─── Click inspector ──────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener("click", (e) => {
    mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    // Check IOLA agents first (spheres, exact hit)
    const visibleAgentMeshes = agentMeshes.filter(m => m.visible);
    const agentHits = raycaster.intersectObjects(visibleAgentMeshes);
    if (agentHits.length > 0) {
        const agent = agentHits[0].object.userData;
        if (agent && agent.norad_id) {
            // Find index into meshAgents for arc drawing
            const idx = meshAgents.findIndex(a => a.norad_id === agent.norad_id);
            showArc(idx);

            document.getElementById("inspector-name").innerText  = agent.name;
            document.getElementById("inspector-norad").innerText = agent.norad_id;
            document.getElementById("inspector-class").innerText = "LEO (IOLA)";
            document.getElementById("inspector-alt").innerText   = `${Math.round(agent.altitude_km)} km`;
            document.getElementById("inspector-mode").innerText    = agent.mode;
            document.getElementById("inspector-battery").innerText = `${Math.round(agent.battery_pct)}%`;
            document.getElementById("inspector-storage").innerText = `${Math.round(agent.storage_pct)}%`;
            document.getElementById("inspector-sunlit").innerText  = agent.sunlit ? "YES" : "NO";
            document.getElementById("inspector-window").innerText  =
                agent.in_contact_window ? `YES (${Math.round(agent.contact_window_remaining*90)} steps)` : "NO";
            document.getElementById("rw-survival").innerText    = (agent.reward_breakdown?.survival  || 0).toFixed(3);
            document.getElementById("rw-mission").innerText     = (agent.reward_breakdown?.mission   || 0).toFixed(3);
            document.getElementById("rw-opt").innerText         = (agent.reward_breakdown?.optionality || 0).toFixed(3);
            document.getElementById("rw-ext").innerText         = (agent.reward_breakdown?.externality || 0).toFixed(3);
            document.getElementById("inspector-agent-section").style.display = "block";
            document.getElementById("inspector").classList.remove("hidden");
            return;
        }
    }

    // Background satellites
    raycaster.params.Points.threshold = camera.position.length() * 0.008;
    for (let c = 0; c < 3; c++) {
        if (!classPts[c].visible) continue;
        const hits = raycaster.intersectObject(classPts[c]);
        if (hits.length > 0) {
            const meta = classPts[c].userData.metas?.[hits[0].index];
            if (!meta) continue;
            document.getElementById("inspector-name").innerText  = meta.name;
            document.getElementById("inspector-norad").innerText = meta.norad_id;
            document.getElementById("inspector-class").innerText = CLASS_NAMES[meta.classIdx];
            document.getElementById("inspector-alt").innerText   = `${Math.round(meta.altitude)} km`;
            document.getElementById("inspector-agent-section").style.display = "none";
            document.getElementById("inspector").classList.remove("hidden");
            return;
        }
    }
    document.getElementById("inspector").classList.add("hidden");
});

// ─── Render loop ──────────────────────────────────────────────────────────────
function animate() {
    requestAnimationFrame(animate);
    controls.update();

    // Earth rotation: use simulation epoch when agents are active so the
    // geographic position of ECI coordinates is correct. Falls back to
    // real-time wall clock when no episode is running.
    let earthRotAngle;
    if (meshActive && simEpochMs !== null) {
        // Extrapolate simulation time forward from the last received step.
        // In LIVE mode, 1 real second = 60 simulated seconds.
        const realElapsedMs = Date.now() - simEpochRealMs;
        const mult = TIME_MULTIPLIERS[timeMode] ?? 1;
        const currentSimMs = simEpochMs + realElapsedMs * mult;
        earthRotAngle = gmstFromMs(currentSimMs);
    } else {
        earthRotAngle = gmstFromMs(Date.now());
    }
    earth.rotation.y      = earthRotAngle;
    atmosphere.rotation.y = earthRotAngle;

    // Smooth agent positions between server steps using linear Keplerian extrapolation.
    // The server sends (x,y,z) at step N and (vx,vy,vz) in km/s.
    // Each frame we apply: pos += vel × Δt_simulated to keep agents moving continuously.
    if (meshActive && simEpochMs !== null) {
        const realElapsedS = (Date.now() - simEpochRealMs) / 1000;
        const mult = TIME_MULTIPLIERS[timeMode] ?? 1;
        const simElapsedS = realElapsedS * mult;

        agentMeshes.forEach((mesh, i) => {
            if (!mesh.visible || !meshAgents[i]) return;
            const a   = meshAgents[i];
            const vel = agentVelocities[a.norad_id];
            if (!vel) return;
            const scale = 1 / 1000;
            mesh.position.set(
                (a.x + vel.vx * simElapsedS) * scale,
                (a.y + vel.vy * simElapsedS) * scale,
                (a.z + vel.vz * simElapsedS) * scale,
            );
        });
    }

    renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();

</script>
